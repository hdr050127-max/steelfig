# steelfig default style (CIVL3206, agreed 2026-10-09): fabricator's-manual look, one accent colour.
name = "default"

[colours]            # sRGB hex; Blender gets them linearised, TikZ as rgb
steel  = "#8f9196"   # main members
light  = "#c5c7cb"   # secondary members: purlins, girts, diagonals
dark   = "#75767a"   # bolts, nuts
accent = "#c9553f"   # ONE subject per figure (muted brick red)
sheet  = "#d9d5c9"   # roof / wall sheeting
weld   = "#5e5e60"
conc   = "#e6e4e0"
grout  = "#cbcac6"
line   = "#000000"   # Freestyle outline: keep black (linear 0)

[render]
resolution = [4200, 2940]   # px before cropping; a 14 cm figure then prints at ~600 dpi
line_width = 2.2            # Freestyle outline, px at full resolution (scaled with quick_scale)
quick_scale = 0.4           # --quick: composition checks only
samples = 128               # EEVEE anti-aliasing samples (64 default)
fast_gi = true              # horizon-scan ambient occlusion: shading where flanges meet webs
shadows = true              # soft sun shadows (angle 8 deg)
shadow_quality = 1.0        # shadow_resolution_scale
background_strength = 0.55

[tikz]
font = "\\footnotesize"
balloon_mm = 3.3
line_width_pt = 0.35
key_hang_mm = 4.5

# ---------------------------------------------------------------- finishes (what the steel looks like)
# Members pick a finish from their catalogue type unless the scene names a material explicitly.
# colour sRGB; metallic / roughness 0..1; noise = roughness variation and fine bump (mill scale); spangle =
# galvanising crystals (Voronoi) as a colour variation. Add a finish per grade (e.g. [finishes.C450]) and map it in
# finish_of to change the look of one grade only.
[finishes.hot_rolled]       # UB, UC, PFC, angles, plates: mill-scale grey with a blue cast, matte-ish
colour = "#858990"
metallic = 0.55
roughness = 0.55
noise = 0.12
spangle = 0.0

[finishes.hollow]           # SHS / RHS / CHS: smoother tube surface
colour = "#8a8d91"
metallic = 0.5
roughness = 0.45
noise = 0.06
spangle = 0.0

[finishes.galvanised]       # Z / C purlins and girts, sheeting: light, spangled
colour = "#b7babd"
metallic = 0.8
roughness = 0.38
noise = 0.04
spangle = 0.08

[finishes.bolt]             # structural bolts, HDG: dark grey
colour = "#4a4c50"
metallic = 0.6
roughness = 0.5
noise = 0.05
spangle = 0.0

[finishes.accent]           # the figure's subject: painted steel in the accent colour
colour = "#c9553f"
metallic = 0.25
roughness = 0.5
noise = 0.06
spangle = 0.0

[finish_of]                 # catalogue type (or grade) -> finish; palette names map too
UB = "hot_rolled"
UC = "hot_rolled"
WB = "hot_rolled"
WC = "hot_rolled"
TFB = "hot_rolled"
PFC = "hot_rolled"
EA = "hot_rolled"
UA = "hot_rolled"
SHS = "hollow"
RHS = "hollow"
CHS = "hollow"
Z = "galvanised"
C = "galvanised"
steel = "hot_rolled"
light = "galvanised"
dark = "bolt"
accent = "accent"
sheet = "galvanised"

[world]                     # soft gradient environment so metal has something to reflect; film stays transparent
sky = "#ffffff"
ground = "#b9bcc0"
strength = 0.95
