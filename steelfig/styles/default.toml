# steelfig default style (CIVL3206, agreed 2026-10-09): fabricator's-manual look, one accent colour.
name = "default"

[colours]            # sRGB hex; Blender gets them linearised, TikZ as rgb
steel  = "#8f9196"   # main members
light  = "#c5c7cb"   # secondary members: purlins, girts, diagonals
dark   = "#75767a"   # bolts, nuts
accent = "#c9553f"   # ONE subject per figure (muted brick red)
sheet  = "#d9d5c9"   # roof / wall sheeting
weld   = "#5e5e60"
conc   = "#e6e4e0"
grout  = "#cbcac6"
line   = "#000000"   # Freestyle outline: keep black (linear 0)

[render]
resolution = [4200, 2940]   # px before cropping; a 14 cm figure then prints at ~600 dpi
line_width = 2.2            # Freestyle outline, px at full resolution (scaled with quick_scale)
quick_scale = 0.4           # --quick: composition checks only
samples = 128               # EEVEE anti-aliasing samples (64 default)
fast_gi = true              # horizon-scan ambient occlusion: shading where flanges meet webs
shadows = true              # soft sun shadows (angle 8 deg)
shadow_quality = 1.0        # shadow_resolution_scale
background_strength = 0.55

[tikz]
font = "\\footnotesize"
balloon_mm = 3.3
line_width_pt = 0.35
key_hang_mm = 4.5
