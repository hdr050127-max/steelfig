# Portal-frame knee at true size (the steelfig TOML format). Build with:
#   steelfig build examples/knee/knee.toml /tmp/knee_out --report /tmp/knee_rep
title = "Portal frame knee: what restrains the designed members"
check = true                               # report members passing through each other (> 5 cm3)
# balloons carry no dx/dy: placed automatically off the steel; add dx/dy to a label to pin it

[[line]]                                   # rafter TOP line: 4 deg pitch from the column face at z = 6.0
name = "roof"
points = [[0.25, 6.0], [8.0, 6.542]]

[[member]]                                 # the column and rafter are declared to the column axis; the knee trims them
name = "col"
section = "460UB82.1"
from = [0, 0, 2.5]
to = "roof.at(0) + V(0, 0, 0.5)"
up = [1, 0, 0]
material = "accent"

[[member]]
name = "raf"
section = "410UB59.7"
from = "roof.at(0)"
to = "roof.at(5.0)"
up = "roof.normal(1)"
align = "top"

[[connection]]                             # end plate, bolts, stiffeners from the two sections; cuts col (top) and raf (start)
type = "knee"
name = "k"
line = "roof"
x = 0.0
column = "col"
rafter = "raf"

[[purlins]]
name = "pur"
line = "roof"
spacing = 1.2
start = 1.2
until = 4.9
y0 = -1.5
y1 = 1.8
section = "Z25019"
cleats = true

[[girts]]
name = "girt"
x = -0.2302
levels = [4.6]
y0 = -1.5
y1 = 1.8
section = "Z25019"

[[fly_brace]]                 # as built: long leg on the purlin web (upslope face), bolt through the web, cleat at the flange tip
name = "fb"
purlins = "pur"
at = [1]
member_depth = "sec('410UB59.7')['d']"
member_bf = "sec('410UB59.7')['b']"
section = "75x75x6 EA"

[anchors]
col = [0.2302, -0.0955, 4.0]
rafter = "roof.at(4.2) - roof.normal(1) * 0.2 + V(0, -0.089, 0)"
purlin = "pur[3] + V(0, -1.3, 0.2)"
girt = [-0.43, -1.3, 4.6]
fly = "pur[1] - roof.normal(1) * 0.33 + V(0, -0.45, 0)"
# elevation (2D dims, ortho view only)
rt = "roof.at(0.55)"
rb = "roof.at(0.55) - roof.normal(1) * sec('410UB59.7')['d']"
ct = [0.2302, 0, 4.8]
cb = [-0.2302, 0, 4.8]
I = "roof.at(0.0)"

[[dim]]                                    # off = "auto" (default): the overlay picks a clear place for the dimension line
name = "le"
a = "roof.at(0.25) - roof.normal(1) * 0.4064 + V(0, -0.089, 0)"
b = "pur[1] - roof.normal(1) * 0.4064 + V(0, -0.089, 0)"

[[wave]]
name = "wave"
a = "roof.at(0.25) - roof.normal(1) * 0.4064 + V(0, -0.089, 0)"
b = "pur[1] - roof.normal(1) * 0.4064 + V(0, -0.089, 0)"
amp = 0.25
side = [0, -1, 0]

[[view]]
name = "knee"
main = true                                # takes ~62 % of the row; the elevation is scaled to fit beside it
camera = [7.5, -8.0, 4.2, 1.8, 0.2, 5.6, 40]
bounds = ["wave"]
draw = [["line", ["wave"], "line width=0.8pt, densely dashed, acc"], ["dim3", "le", "$L_e = 2400$", "below"]]
  [[view.label]]
  anchor = "col"
  text = "460UB82.1 column (designed)"
  [[view.label]]
  anchor = "rafter"
  text = "410UB59.7 rafter"
  [[view.label]]
  anchor = "k.ep"
  text = "bolted end plate"
  [[view.label]]
  anchor = "k.bolt"
  text = "M20 bolts above and below each rafter flange"
  [[view.label]]
  anchor = "k.stiff"
  text = "column stiffeners in line with the rafter flanges"
  [[view.label]]
  anchor = "purlin"
  text = "Z25019 purlins at 1200 on the top flange"
  [[view.label]]
  anchor = "girt"
  text = "Z25019 girt on the outside flange"
  [[view.label]]
  anchor = "fly"
  text = "fly brace (both sides) to the bottom flange"

[[view]]
name = "knee_elev"
ortho = { look = "+y", scale = 2.6, at = [0.6, 0, 5.55] }
height_cm = 5.5
crop = [[-0.9, 0, 4.5], [1.6, 0, 6.45]]
caption = "elevation at the knee, looking north"
draw = [["dim", "rt", "rb", "406", 0.6, "right"], ["dim", "ct", "cb", "460", -0.5, "below"]]
  [[view.label]]
  anchor = "I"
  text = ""
  num = 1

[figure]
name = "knee"
key_cols = 1
key_beside = true
key_extra = ["\\tikz[baseline=-0.6ex]\\draw[line width=0.8pt, densely dashed, acc] (0,0) -- (0.6,0); buckled shape of the bottom flange under hogging (exaggerated); $L_e$ from the knee to the fly brace"]
