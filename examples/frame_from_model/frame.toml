# A frame line drawn straight from an analysis model (resources/models/portal-24m, a 24 m portal frame): no coordinates retyped.
# Sections come from the model; the two designed members are the accent. Three frames at 7.5 m, purlins at 1200.
#   steelfig build examples/frame_from_model/frame.toml /tmp/frame_out --report /tmp/frame_rep --quick
title = "Three frames from the analysis model"

[[model]]
path = "res:models/portal-24m-nodes.csv"   # the shared example model (resources/models)
sections = { }                                        # the members.csv already carries catalogue designations
accent = [1, 102]                                      # member ids: west column, west rafter
frames = [0.0, 7.5, 15.0]
top_lift = 0.2269                                      # rafter tops flush: each piece hangs from the axis + half the haunch depth

[[line]]                                   # rafter top line = Microstran rafter axis lifted by half the haunch depth
name = "roof"
points = [[0.0, 6.0], [12.0, 7.0498], [24.0, 6.0]]
lift = 0.2269                              # half the 460UB67.1 depth: the top-flange line

[[purlins]]
name = "pur"
line = "roof"
spacing = 1.2
start = 1.2
until = 23.3
y0 = -1.4
y1 = 16.4
section = "Z20019"

[anchors]
colA = [0.2013, -0.089, 3.5]
rafAB = "roof.at(7.0) - roof.normal(7) * 0.2 + V(0, -0.086, 0)"
haunchA = "roof.at(1.3) - roof.normal(1) * 0.25 + V(0, -0.095, 0)"
colG = [23.8, -0.089, 3.5]
purlin = "pur[7] + V(0, -1.2, 0.2)"
gA = [0.0, 0.0, -1.3]
gB = [12.0, 0.0, -1.3]
gC = [24.0, 0.0, -1.3]

[[view]]
name = "frame"
camera = "auto"
width_cm = 15.6
bounds = ["gA", "gC"]
draw = [["grid", "gA", "A"], ["grid", "gB", "B"], ["grid", "gC", "C"]]
  [[view.label]]
  anchor = "colA"
  text = "410UB53.7 column (designed)"
  [[view.label]]
  anchor = "rafAB"
  text = "360UB44.7 rafter (designed)"
  [[view.label]]
  anchor = "haunchA"
  text = "460UB67.1 haunch"
  [[view.label]]
  anchor = "colG"
  text = "410UB53.7 column"
  [[view.label]]
  anchor = "purlin"
  text = "Z20019 purlins at 1200"

[figure]
name = "frame"
key_cols = 2
