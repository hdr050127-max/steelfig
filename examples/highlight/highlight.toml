# Two-stage figure from the same model: (a) the plain structure, nothing on it; (b) the same view with the mid
# rafter tinted and outlined from the ID render, everything else faded, the frame's tributary strip filled and
# dimensioned, labels on the automatic member anchors (m.<name>). Build once, then change only the annotation:
#   steelfig build examples/highlight/highlight.toml /tmp/hl_out --report /tmp/hl_rep --quick
#   steelfig annotate examples/highlight/highlight.toml /tmp/hl_out --report /tmp/hl_rep      (no Blender)
title = "Plain view first, then highlights"

[[model]]
path = "../frame_from_model/D3_M9_opt1_adopt.arc"
sections = { "200x200x9.0 SHS" = "200x200x9SHS" }
xmax = 47.0
frames = [0.0, 11.315, 22.63]
top_lift = 0.2665

[[line]]
name = "roof"
points = [[0.0, 10.5102], [6.2780, 10.7950], [17.4930, 11.3038], [21.9930, 11.5079], [26.4930, 11.7121], [39.7530, 12.3136], [44.2530, 12.5178], [48.7530, 12.7219]]
lift = 0.2665

[[purlins]]
name = "pur"
line = "roof"
spacing = 1.2
start = 1.2
until = 46.5
y0 = -1.4
y1 = 24.0
section = "Z25019"

[anchors]
# tributary strip of the middle frame (half way to each neighbour), lifted just above the purlins
strip = ["roof.at(0.3, 11.315 - 5.6575) + roof.normal(1) * 0.30", "roof.at(46.5, 11.315 - 5.6575) + roof.normal(40) * 0.30",
         "roof.at(46.5, 11.315 + 5.6575) + roof.normal(40) * 0.30", "roof.at(0.3, 11.315 + 5.6575) + roof.normal(1) * 0.30"]
gA = [0.0, 0.0, -1.3]
gB = [21.993, 0.0, -1.3]
gC = [44.253, 0.0, -1.3]

[[dim]]
name = "bt"
a = "roof.at(46.5, 11.315 - 5.6575) + roof.normal(40) * 0.30"
b = "roof.at(46.5, 11.315 + 5.6575) + roof.normal(40) * 0.30"
off = [2.5, 0, 0]

[[view]]                       # (a) nothing on it
name = "plain"
camera = [-17, -33, 16, 17, 8, 5.0, 30]
width_cm = 15.6
bounds = ["gA", "gC"]
caption = "(a) the model as drawn: three frames, purlins at 1200"

[[view]]                       # (b) same camera, annotated after the fact
name = "marked"
camera = [-17, -33, 16, 17, 8, 5.0, 30]
width_cm = 15.6
bounds = ["gA", "gC", "strip"]
caption = "(b) the mid rafter of the middle frame and the roof it carries"
highlight = [{ objects = ["m101_11.315"], colour = "#c9553f", alpha = 0.55, outline = 2, dim = 0.35 }]
draw = [["fill", ["strip"], "acc, opacity=0.18"], ["line", ["strip#0", "strip#1", "strip#2", "strip#3", "strip#0"], "acc, line width=0.4pt, densely dashed"],
        ["dim3", "bt", "$b_t = 11.315$ m", "above"], ["grid", "gA", "A"], ["grid", "gB", "B"], ["grid", "gC", "C"]]
  [[view.label]]
  anchor = "m.m101_11.315"
  text = "360UB50.7 mid rafter A--B of the middle frame"
  dx = -0.5
  dy = -1.6
  [[view.label]]
  anchor = "m.m1_11.315"
  text = "610UB113 column"
  dx = -1.2
  dy = -0.6

[figure]
name = "highlight"
key_cols = 2
key_extra = ["\\tikz[baseline=-0.6ex]\\fill[acc, opacity=0.18] (0,-0.12) rectangle (0.5,0.12); roof carried by the middle frame: half way to each neighbour, $b_t = 11.315$ m"]
