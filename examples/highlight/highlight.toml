# Two-stage figure from the same model: (a) the plain structure, nothing on it; (b) the same view with the mid
# rafter tinted and outlined from the ID render, everything else faded, the frame's tributary strip filled and
# dimensioned, labels on the automatic member anchors (m.<name>). Build once, then change only the annotation:
#   steelfig build examples/highlight/highlight.toml /tmp/hl_out --report /tmp/hl_rep --quick
#   steelfig annotate examples/highlight/highlight.toml /tmp/hl_out --report /tmp/hl_rep      (no Blender)
title = "Plain view first, then highlights"

[[model]]
path = "res:models/portal-24m-nodes.csv"
sections = { }
frames = [0.0, 7.5, 15.0]
top_lift = 0.2269

[[line]]
name = "roof"
points = [[0.0, 6.0], [12.0, 7.0498], [24.0, 6.0]]
lift = 0.2269                              # half the 460UB67.1 depth: the top-flange line

[[purlins]]
name = "pur"
line = "roof"
spacing = 1.2
start = 1.2
until = 23.3
y0 = -1.4
y1 = 16.4
section = "Z20019"

[anchors]
# tributary strip of the middle frame (half way to each neighbour), lifted just above the purlins
strip = ["roof.at(0.3, 7.5 - 3.75) + roof.normal(1) * 0.30", "roof.at(23.7, 7.5 - 3.75) + roof.normal(23) * 0.30",
         "roof.at(23.7, 7.5 + 3.75) + roof.normal(23) * 0.30", "roof.at(0.3, 7.5 + 3.75) + roof.normal(1) * 0.30"]
gA = [0.0, 0.0, -1.3]
gB = [12.0, 0.0, -1.3]
gC = [24.0, 0.0, -1.3]

[[dim]]
name = "bt"
a = "roof.at(23.7, 7.5 - 3.75) + roof.normal(23) * 0.30"
b = "roof.at(23.7, 7.5 + 3.75) + roof.normal(23) * 0.30"
off = [2.5, 0, 0]

[[view]]                       # (a) nothing on it
name = "plain"
camera = "auto"
width_cm = 15.6
bounds = ["gA", "gC"]
caption = "(a) the model as drawn: three frames, purlins at 1200"

[[view]]                       # (b) same camera, annotated after the fact
name = "marked"
camera = "auto"
width_cm = 15.6
bounds = ["gA", "gC", "strip"]
caption = "(b) the mid rafter of the middle frame and the roof it carries"
highlight = [{ objects = ["m102_7.5"], colour = "#c9553f", alpha = 0.55, outline = 2, dim = 0.35 }]
draw = [["fill", ["strip"], "acc, opacity=0.18"], ["line", ["strip#0", "strip#1", "strip#2", "strip#3", "strip#0"], "acc, line width=0.4pt, densely dashed"],
        ["dim3", "bt", "$b_t = 7.5$ m", "above"], ["grid", "gA", "A"], ["grid", "gB", "B"], ["grid", "gC", "C"]]
  [[view.label]]
  anchor = "m.m102_7.5"
  text = "360UB44.7 rafter of the middle frame"
  [[view.label]]
  anchor = "m.m1_7.5"
  text = "410UB53.7 column"

[figure]
name = "highlight"
key_cols = 2
key_extra = ["\\tikz[baseline=-0.6ex]\\fill[acc, opacity=0.18] (0,-0.12) rectangle (0.5,0.12); roof carried by the middle frame: half way to each neighbour, $b_t = 7.5$ m"]
