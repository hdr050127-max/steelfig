[[dim]]
name = "sy"
a = [0.1413, -0.06, 0.072]
b = [0.1413, 0.06, 0.072]
off = [0.55, 0, 0]

[[view]]
name = "base3d"
camera = "auto"
auto = { focus = ["b_bp"], dir = [0.8, -1.0, 0.55], lens = 45, fill = 0.78 }
width_cm = 9.5
draw = [["dim3", "sx", "283", "below"], ["dim3", "sy", "120", "below"]]
caption = "(a) base of the column"
  [[view.label]]
  anchor = "b.col"
  text = "410UB53.7 column"
  [[view.label]]
  anchor = "b.bp"
  text = "base plate"
  [[view.label]]
  anchor = "b.ab"
  text = "four holding-down bolts inside the flanges"
  [[view.label]]
  anchor = "b.grout"
  text = "40 mm grout"
  [[view.label]]
  anchor = "b.foot"
  text = "concrete footing (shown schematically)"

[[view]]
name = "baseplan"
ortho = { look = "-z", auto = true, fit = ["b_bp", "b_foot"], fill = 0.85 }     # fitted to the base plate and footing
cut = { point = [0, 0, 0.35], normal = [0, 0, 1], objects = ["col"], plane = "xy" }  # this view only: column cut 350 mm up, hatched
caption = "(b) plan of the base plate"
draw = [["dim", "cA", "cB", "283", 0.6, "below"], ["dim", "cB", "cC", "120", 0.6, "right"]]

[figure]
name = "colbase"
layout = "row"
key_cols = 2
