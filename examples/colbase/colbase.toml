  [[view.label]]
  anchor = "b.col"
  text = "610UB113 west column"
  [[view.label]]
  anchor = "b.bp"
  text = "base plate"
  [[view.label]]
  anchor = "b.ab"
  text = "four holding-down bolts inside the flanges"
  [[view.label]]
  anchor = "b.grout"
  text = "40 mm grout"
  [[view.label]]
  anchor = "b.foot"
  text = "concrete footing (shown schematically)"

[[view]]
name = "baseplan"
ortho = { look = "-z", scale = 1.1, at = [0, 0, 1.0] }
