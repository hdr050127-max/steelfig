title = "Column base: pinned"
check = true

[[member]]
name = "col"
section = "410UB53.7"
from = [0, 0, 0]
to = [0, 0, 1.6]
up = [1, 0, 0]

[[connection]]
type = "base"
name = "b"
x = 0.0
column = "col"

[anchors]
pA = [-0.1413, -0.06, 0.072]
pB = [0.1413, -0.06, 0.072]
pC = [0.1413, 0.06, 0.072]
cA = [-0.1413, -0.06, 0.09]
cB = [0.1413, -0.06, 0.09]
cC = [0.1413, 0.06, 0.09]

[[dim]]
name = "sx"
a = [-0.1413, -0.06, 0.072]
b = [0.1413, -0.06, 0.072]
