# The four standard connections of a portal frame, each generated from the member sections by one [[connection]]
# line: (a) rigid knee, (b) bolted end-plate splice, (c) pinned cap plate on an SHS column, (d) pinned base plate.
# Every part is placed by the generator (plate sizes, bolt rows, stiffeners, grips) and the members are trimmed
# to the connection faces, so the parts touch without passing through each other (check = true proves it).
#   steelfig build examples/connections/connections.toml /tmp/cn_out --report /tmp/cn_rep --quick
title = "Standard connections"
check = true

[[line]]
name = "roof"
points = [[0.0, 10.5102], [6.278, 10.795], [21.993, 11.5079], [30.0, 11.871]]
lift = 0.2665

# (a) knee at grid A
[[member]]
name = "colA"
section = "610UB113"
from = [0, 0, 8.0]
to = "roof.at(0) + V(0, 0, 0.5)"
up = [1, 0, 0]
[[member]]
name = "haunchA"
section = "530UB92.4"
from = "roof.at(0)"
to = "roof.at(1.6)"
up = "roof.normal(1)"
align = "top"
[[connection]]
type = "knee"
name = "kn"
line = "roof"
x = 0.0
column = "colA"
rafter = "haunchA"
diagonal = true

# (b) splice at x = 6.278: haunch to mid rafter
[[member]]
name = "hA"
section = "530UB92.4"
from = "roof.at(5.3)"
to = "roof.at(6.278)"
up = "roof.normal(5)"
align = "top"
[[member]]
name = "rA"
section = "360UB50.7"
from = "roof.at(6.278)"
to = "roof.at(7.3)"
up = "roof.normal(7)"
align = "top"
[[connection]]
type = "splice"
name = "sp"
line = "roof"
x = 6.278
a = "hA"
b = "rA"

# (c) cap at grid B: haunch continuous over an SHS column
[[member]]
name = "hB"
section = "530UB82.0"
from = "roof.at(21.0)"
to = "roof.at(23.0)"
up = "roof.normal(22)"
align = "top"
[[member]]
name = "colB"
section = "200x200x9SHS"
from = [21.993, 0, 9.6]
to = [21.993, 0, 11.6]
up = [1, 0, 0]
[[connection]]
type = "cap"
name = "cp"
line = "roof"
x = 21.993
column = "colB"
rafter = "hB"

# (d) base of the west column (drawn at x = 50 so the four details do not touch)
[[member]]
name = "colBase"
section = "610UB113"
from = [50, 0, 0]
to = [50, 0, 1.6]
up = [1, 0, 0]
[[connection]]
type = "base"
name = "bs"
x = 50.0
column = "colBase"

[[dim]]
name = "lev"
a = "V(50 - 0.3035 + 0.06, -0.06, 0.06)"
b = "V(50 + 0.3035 - 0.06, -0.06, 0.06)"
off = [0, -0.55, 0]

[[view]]
name = "cn_knee"
