# The four standard connections of a 24 m portal frame (original example: 410UB53.7 columns, 460UB67.1 haunches,
# 360UB44.7 rafters, 150x150x6 SHS internal column of a lean-to), each generated from the member sections by one [[connection]]
# line: (a) rigid knee, (b) bolted end-plate splice, (c) pinned cap plate on an SHS column, (d) pinned base plate.
# Balloons have no dx/dy: steelfig places them off the steel itself.
# Every part is placed by the generator (plate sizes, bolt rows, stiffeners, grips) and the members are trimmed
# to the connection faces, so the parts touch without passing through each other (check = true proves it).
#   steelfig build examples/connections/connections.toml /tmp/cn_out --report /tmp/cn_rep --quick
title = "Standard connections"
check = true

[[line]]
name = "roof"
points = [[0.0, 6.0], [12.0, 7.0498], [24.0, 6.0]]
lift = 0.2269                              # half the 460UB67.1 depth: the top-flange line

# (a) knee at grid A
[[member]]
name = "colA"
section = "410UB53.7"
from = [0, 0, 4.0]
to = "roof.at(0) + V(0, 0, 0.5)"
up = [1, 0, 0]
[[member]]
name = "haunchA"
section = "460UB67.1"
from = "roof.at(0)"
to = "roof.at(1.6)"
up = "roof.normal(1)"
align = "top"
[[connection]]
type = "knee"
name = "kn"
line = "roof"
x = 0.0
column = "colA"
rafter = "haunchA"
diagonal = true

# (b) splice at x = 2.6: haunch to rafter
[[member]]
name = "hA"
section = "460UB67.1"
from = "roof.at(1.7)"
to = "roof.at(2.6)"
up = "roof.normal(2)"
align = "top"
[[member]]
name = "rA"
section = "360UB44.7"
from = "roof.at(2.6)"
to = "roof.at(3.6)"
up = "roof.normal(3)"
align = "top"
[[connection]]
type = "splice"
name = "sp"
line = "roof"
x = 2.6
a = "hA"
b = "rA"

# (c) cap: rafter continuous over an SHS column (a lean-to post at x = 8)
[[member]]
name = "hB"
section = "360UB44.7"
from = "roof.at(7.0)"
to = "roof.at(9.0)"
up = "roof.normal(8)"
align = "top"
[[member]]
name = "colB"
section = "150x150x6SHS"
from = [8.0, 0, 5.0]
to = [8.0, 0, 7.0]
up = [1, 0, 0]
[[connection]]
type = "cap"
name = "cp"
line = "roof"
x = 8.0
column = "colB"
rafter = "hB"

# (d) base of a column (drawn at x = 50 so the four details do not touch)
[[member]]
name = "colBase"
section = "410UB53.7"
from = [50, 0, 0]
to = [50, 0, 1.6]
up = [1, 0, 0]
[[connection]]
type = "base"
name = "bs"
x = 50.0
column = "colBase"

[[dim]]
name = "lev"
a = "V(50 - 0.2013 + 0.06, -0.06, 0.06)"
b = "V(50 + 0.2013 - 0.06, -0.06, 0.06)"
off = [0, -0.55, 0]

[[view]]
name = "cn_knee"
camera = [2.7, -2.9, 5.0, 0.5, 0, 5.75, 45]
crop = [[-0.6, -0.3, 4.1], [1.9, 0.3, 6.6]]
height_cm = 5.4
max_width_cm = 7.4
caption = "(a) Knee: rigid"
  [[view.label]]
  anchor = "m.colA"
  text = "410UB53.7 column"
  [[view.label]]
  anchor = "m.haunchA"
  text = "460UB67.1 haunch"
  [[view.label]]
  anchor = "kn.ep"
  text = "end plate"
  [[view.label]]
  anchor = "kn.bolt"
  text = "bolts above and below each haunch flange"
  [[view.label]]
  anchor = "kn.bolt2"
  text = ""
  num = 4
  [[view.label]]
  anchor = "kn.stiff"
  text = "stiffeners in line with the haunch flanges"

[[view]]
name = "cn_splice"
camera = [2.95, -2.9, 5.6, 2.6, 0, 6.25, 45]
crop = [[1.4, 0, 5.5], [3.9, 0, 6.9]]
height_cm = 5.4
max_width_cm = 7.4
caption = "(b) Haunch to rafter splice: continuous"
  [[view.label]]
  anchor = "m.hA"
  text = "460UB67.1 haunch"
  [[view.label]]
  anchor = "m.rA"
  text = "360UB44.7 rafter"
  [[view.label]]
  anchor = "sp.ep"
  text = "two bolted end plates"
  [[view.label]]
  anchor = "sp.bolt"
  text = "bolts above and below each flange of the 360UB"

[[view]]
name = "cn_cap"
camera = [9.35, -2.3, 5.8, 8.0, 0, 6.55, 45]
crop = [[6.9, -0.3, 5.0], [9.1, 0.3, 7.4]]
height_cm = 5.4
max_width_cm = 7.4
caption = "(c) Rafter over an SHS column: pinned"
  [[view.label]]
  anchor = "m.hB"
  text = "360UB44.7 rafter, continuous over the post"
  [[view.label]]
  anchor = "cp.col"
  text = "150$\\times$150$\\times$6 SHS post"
  [[view.label]]
  anchor = "cp.capp"
  text = "cap plate"
  [[view.label]]
  anchor = "cp.bolt"
  text = "bolts outside the tube walls"
  [[view.label]]
  anchor = "cp.ws"
  text = "web stiffeners over the tube walls"

[[view]]
name = "cn_base"
camera = [51.9, -2.7, 1.8, 50.05, 0, 0.35, 42]
crop = [[49.1, -0.5, -0.8], [51.0, -0.5, 1.8]]
height_cm = 5.4
max_width_cm = 7.4
caption = "(d) Column base: pinned"
draw = [["dim3", "lev", "283", "below"]]
  [[view.label]]
  anchor = "bs.col"
  text = "410UB53.7 column"
  [[view.label]]
  anchor = "bs.bp"
  text = "base plate"
  [[view.label]]
  anchor = "bs.ab"
  text = "four holding-down bolts inside the flanges"
  [[view.label]]
  anchor = "bs.ab2"
  text = ""
  num = 3
  [[view.label]]
  anchor = "bs.grout"
  text = "40 mm grout pad"
  [[view.label]]
  anchor = "bs.foot"
  text = "concrete footing"

[figure]
name = "connections"
layout = "grid2"
key_cols = 2
